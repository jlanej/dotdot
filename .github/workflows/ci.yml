# CI runs on GitHub's cloud runners only — nothing here ever installs on a
# developer machine. Deno (a single static binary) typechecks the JSDoc-typed
# source and runs the pure-logic tests. The app itself has no build step.
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Task bodies live in deno.json — the one source of truth for what
      # gets typechecked and tested (tests/typecheck.html mirrors it).
      - run: deno task check
      - run: deno task test
